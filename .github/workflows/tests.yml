name: Tests

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  unittest:
    # Windows: field devices and the demo launcher; Linux: the Docker image.
    # Both ship PowerShell, so the generated and demo .ps1 files are parsed on each.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r relay/requirements.txt

      - name: Byte-compile everything
        run: python -m compileall -q relay demo tools tests

      - name: Run test suite
        run: python -m unittest discover -s tests -v

      - name: End-to-end against a local router (direct, multicast, server)
        shell: bash
        env:
          E2E_REQUIRED: "1"
        run: |
          python demo/local_router.py > router.log 2>&1 &
          sleep 5
          python tests/e2e_gateway.py
          python tests/e2e_modes.py

  field-install:
    # Installs the field package as a user would (language and mode typed in) on Windows
    # PowerShell 5.1, checks the running relay, uninstalls.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install, check, uninstall
        run: ./tests/ci_install_windows.ps1

  field-install-linux:
    # Installs the Linux field package as a user would (systemd service with --at-boot, the
    # default start, the template), checks the running relay, uninstalls. Lints every .sh file.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: shellcheck
        run: shellcheck -x -P SCRIPTDIR --severity=warning tools/field_package/linux/*.sh demo/*.sh tests/*.sh
      - name: Install, check, uninstall
        run: bash tests/ci_install_linux.sh

  docker:
    # Image build, Docker HEALTHCHECK, doctor in the container, compose files.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build, start, wait for healthy
        run: ./tests/ci_docker.sh
