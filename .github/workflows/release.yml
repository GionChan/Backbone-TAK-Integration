name: Release

# Tag vX.Y.Z (must equal relay __version__ and the newest CHANGELOG section) publishes:
#   - image ghcr.io/<owner>/efdi-tak-relay:X.Y.Z, :X.Y, :latest (linux/amd64 + linux/arm64,
#     SBOM and provenance attached). A new GHCR package of a private repo is private.
#   - GitHub Release with the field-package templates for Windows (.zip) and Linux (.tar.gz), no
#     certificate inside, and SHA256SUMS.
# Nothing is published until every check has passed: push-image and publish run last.
# feature/** pushes and workflow_dispatch are a dry run: everything is built and tested,
# nothing is published.
on:
  push:
    tags: ["v*.*.*"]
    branches: ["feature/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: v
        name: Versions agree (tag, relay, CHANGELOG, compose)
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            python3 tools/check_release.py --tag "$GITHUB_REF_NAME" --notes notes.md
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            python3 tools/check_release.py --notes notes.md
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-notes
          path: notes.md

  image:
    # Build once into an OCI archive, test each architecture from that archive, and hand the same
    # archive to push-image. Nothing is pushed here, and nothing is rebuilt later.
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build (amd64 + arm64) into an OCI archive
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          # No build-record artifact: publish does not need it, and its download failed in v1.1.0.
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          target: relay
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=relay-image.tar
          labels: |
            org.opencontainers.image.title=EFDI TAK relay
            org.opencontainers.image.version=${{ needs.check.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Each architecture of that archive runs (relay, doctor, mediamtx, dependencies)
        run: |
          command -v skopeo >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q skopeo; }
          for arch in amd64 arm64; do
            skopeo copy --override-os linux --override-arch "$arch"               oci-archive:relay-image.tar "docker-daemon:relay-$arch:test"
            docker run --rm --platform "linux/$arch" "relay-$arch:test" python3 -c               "import zenoh, cryptography, av, PIL, platform; print('$arch ok', platform.machine())"
            docker run --rm --platform "linux/$arch" "relay-$arch:test" mediamtx --version
            docker run --rm --platform "linux/$arch" -e GOAT_LOCAL_ROUTER=tcp/127.0.0.1:1 "relay-$arch:test"               python3 relay/doctor.py | tail -3
          done
          sha256sum relay-image.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: relay-image
          path: relay-image.tar
          retention-days: 1

  push-image:
    # Only after the image, the field package and the Windows install test have all passed, so a
    # failed check never leaves an image (or :latest) published without its release. Pushes the
    # exact archive the image job tested.
    if: needs.check.outputs.publish == 'true'
    needs: [check, image, install-template, install-template-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: relay-image
      - name: Push the tested archive (all architectures and attestations)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          command -v skopeo >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q skopeo; }
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/efdi-tak-relay"
          v="${{ needs.check.outputs.version }}"
          echo "$TOKEN" | skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin
          skopeo copy --all oci-archive:relay-image.tar "docker://$image:$v"
          for t in "${v%.*}" latest; do
            skopeo copy --all "docker://$image:$v" "docker://$image:$t"
          done
          skopeo inspect --raw "docker://$image:$v" | sha256sum

  field-package:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Build the templates (no certificate; Windows with bundled Python, Linux with wheels)
        run: |
          v="${{ needs.check.outputs.version }}"
          python tools/make_relay_package.py --template --out "release/efdi-tak-relay-$v-windows-x64.zip"
          python tools/make_relay_package.py --template --platform linux --out "release/efdi-tak-relay-$v-linux.tar.gz"
      - name: Nothing secret inside
        run: |
          python3 - release/*.zip release/*.tar.gz <<'EOF'
          import sys, tarfile, zipfile
          for path in sys.argv[1:]:
              if path.endswith(".zip"):
                  z = zipfile.ZipFile(path)
                  names, env = z.namelist(), z.read("device.env").decode()
              else:
                  t = tarfile.open(path)
                  names = [n.split("/", 1)[1] for n in t.getnames() if "/" in n]
                  env = t.extractfile(next(m for m in t.getmembers() if m.name.endswith("/device.env"))).read().decode()
              bad = [n for n in names if n.startswith("certs/") and n not in ("certs/README.txt", "certs/tak")]
              bad += [n for n in names if n.lower().endswith((".pem", ".key", ".p12", ".cbor"))]
              bad += [ln for ln in env.splitlines() if ln.startswith(("GOAT_ORG=", "GATEWAY_SYSTEM=", "TAK_SERVER"))]
              assert not bad, f"{path}: template must not contain: {bad}"
              print(path, "clean:", len(names), "files")
          EOF
      - name: Checksums
        run: cd release && sha256sum *.zip *.tar.gz > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: field-package
          path: release/

  install-template:
    # Installs the exact template that would be published, on Windows with no Python on PATH.
    needs: field-package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: field-package
          path: release
      - name: Install the template, check, uninstall
        run: ./tests/ci_install_windows.ps1 -TemplateZip (Get-ChildItem release\*.zip | Select-Object -First 1).FullName

  install-template-linux:
    # Installs the exact Linux template that would be published, with no package index reachable.
    needs: field-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: field-package
          path: release
      - name: Install the template, check, uninstall
        run: bash tests/ci_install_linux.sh --template release/*.tar.gz

  publish:
    if: needs.check.outputs.publish == 'true'
    needs: [check, push-image, field-package, install-template, install-template-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Only the two artifacts the release needs, by name.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: field-package
          path: artifacts/field-package
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-notes
          path: artifacts/release-notes
      - name: Checksum still matches
        run: cd artifacts/field-package && sha256sum -c SHA256SUMS
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/field-package/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "EFDI TAK relay ${{ needs.check.outputs.version }}" \
            --notes-file artifacts/release-notes/notes.md
